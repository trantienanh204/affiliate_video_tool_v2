services:
  app:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./outputs:/app/outputs
      - ./cache:/app/cache
      - ./assets:/app/assets
      - ./workflows:/app/workflows
      - ./.env:/app/.env:ro
      - ./app:/app/app
      - ./ai:/app/ai
      - ./video:/app/video
      - ./models:/app/models
      - ./services:/app/services
      - ./core:/app/core
      - ./tests:/app/tests
      - ./utils:/app/utils
      - ./tts:/app/tts
      - ./run.py:/app/run.py
    environment:
      - AVA_RENDER_MODE=${AVA_RENDER_MODE:-gpu}
      - AVA_COMFYUI_ENABLED=${AVA_COMFYUI_ENABLED:-true}
      - AVA_REQUIRE_AI_VIDEO=${AVA_REQUIRE_AI_VIDEO:-true}
      - AVA_I2V_MAX_SCENES=${AVA_I2V_MAX_SCENES:-1}
      - AVA_I2V_SCENE_DURATION=${AVA_I2V_SCENE_DURATION:-3}
      - AVA_COMFYUI_URL=${AVA_COMFYUI_URL:-http://host.docker.internal:8188}
      - AVA_VIDEO_PROVIDER=${AVA_VIDEO_PROVIDER:-hf_zerogpu}
      - AVA_VIDEO_PROVIDER_FALLBACKS=${AVA_VIDEO_PROVIDER_FALLBACKS:-fal,comfyui}
      - AVA_HF_CHARACTER_ENABLED=${AVA_HF_CHARACTER_ENABLED:-true}
      - AVA_HF_CHARACTER_SPACE=${AVA_HF_CHARACTER_SPACE:-hugging-apps/qwen-image-2-1}
      - AVA_HF_CHARACTER_STEPS=${AVA_HF_CHARACTER_STEPS:-10}
      - FAL_KEY=${FAL_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - AVA_OLLAMA_BASE_URL=http://ollama:11434
      - AVA_LOG_LEVEL=INFO
    depends_on:
      - ollama
    restart: unless-stopped

  # Optional local LLM – pull model: docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Uncomment if you have NVIDIA GPU for Ollama:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional ComfyUI – user must provide their own image / mount
  # comfyui:
  #   image: yanwk/comfyui-boot:latest
  #   ports:
  #     - "8188:8188"
  #   volumes:
  #     - comfyui_data:/root
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  ollama_data:
